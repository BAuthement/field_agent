services:
  field-agent:
    build: .
    container_name: field-agent
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - field-agent-data:/app/data
    environment:
      - FIELD_AGENT_SECRET=${FIELD_AGENT_SECRET:-change-me-in-production}
      - PORT=5000
    restart: unless-stopped

volumes:
  field-agent-data:
