{% extends "base.html" %}
{% block content %}
<div class="authwrap">
  <div class="card">
    <div class="logo-band"><img class="login-logo" src="{{ url_for('static', filename='img/ma-logo.png') }}" alt="MissionaryAgents"></div>
    <h1 class="center">{{ t('app_name') }}</h1>
    <p class="sub">{{ t('tagline') }}</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post">
      <label>{{ t('email') }}</label>
      <input type="email" name="email" required>
      <label>{{ t('password') }}</label>
      <input type="password" name="password" required>
      <button class="btn" type="submit">{{ t('login') }}</button>
    </form>
    <p class="mt">{{ t('no_account') }} <a href="{{ url_for('register') }}">{{ t('register') }}</a></p>
  </div>
</div>
{% endblock %}
