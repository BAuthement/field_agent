{% extends "base.html" %}
{% block content %}
<h1>{{ t('profile_title') }}</h1>
{% if saved %}<div class="alert">{{ t('profile_saved') }}</div>{% endif %}
<div class="card">
  <form method="post">
    <label>{{ t('name') }}</label>
    <input type="text" name="name" value="{{ user.name }}" required>
    <label>{{ t('email') }}</label>
    <input type="email" value="{{ user.email }}" disabled>
    <label>{{ t('field_location') }}</label>
    <input type="text" name="field_location" value="{{ user.field_location or '' }}" placeholder="{{ t('field_location_ph') }}">
    <label>{{ t('language') }}</label>
    <select name="language" disabled>
      <option>{{ 'Espa\u00f1ol' if lang == 'es' else 'English' }}</option>
    </select>
    <p class="sub">{{ t('language') }}: <a href="{{ url_for('set_lang', code='en') }}">EN</a> | <a href="{{ url_for('set_lang', code='es') }}">ES</a></p>
    <button class="btn" type="submit">{{ t('update_profile') }}</button>
  </form>
</div>
<a class="btn danger" href="{{ url_for('logout') }}">{{ t('nav_logout') }}</a>
{% endblock %}
